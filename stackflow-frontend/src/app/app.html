@if (authService.isAuthenticated()) {
  <div class="admin-shell">
    <aside class="sidebar">
      <a class="brand" routerLink="/dashboard" aria-label="StackFlow dashboard">
        <span class="brand-mark">SF</span>
        <span><strong>StackFlow</strong><small>Admin Management</small></span>
      </a>

      <nav aria-label="Admin navigation">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/employees" routerLinkActive="active">Employees</a>
        <a routerLink="/attendance" routerLinkActive="active">Attendance</a>
        <a routerLink="/leaves" routerLinkActive="active">Leave Requests</a>
        <a routerLink="/departments" routerLinkActive="active">Departments</a>
        <a routerLink="/projects" routerLinkActive="active">Projects</a>
      </nav>

      <div class="sidebar-footer">
        <small>{{ authService.adminEmail() }}</small>
        <button type="button" (click)="logout()">Logout</button>
      </div>
    </aside>

    <main class="page-content"><router-outlet /></main>
  </div>
} @else {
  <router-outlet />
}
